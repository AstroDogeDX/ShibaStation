- type: entity
  id: PartAvali
  parent: BaseItem
  name: "avali body part"
  abstract: true
  components:
  - type: Damageable
    damageContainer: Biological
  - type: BodyPart
  - type: ContainerContainer
    containers:
      bodypart: !type:Container
        ents: []
  - type: StaticPrice #DynamicPrice
    price: 100
  - type: Tag
    tags:
      - Trash

- type: entity
  id: TorsoAvali
  name: "avali torso"
  parent: PartAvali
  components:
  - type: Sprite
    netsync: false
    sprite: Mobs/Species/Avali/parts.rsi
    state: "torso_m"
  - type: Icon
    sprite: Mobs/Species/Avali/parts.rsi
    state: "torso_m"
  - type: BodyPart
    partType: Torso

- type: entity
  id: HeadAvali
  name: "avali head"
  parent: PartAvali
  components:
  - type: Sprite
    netsync: false
    sprite: Mobs/Species/Avali/parts.rsi
    state: "head_m"
  - type: Icon
    sprite: Mobs/Species/Avali/parts.rsi
    state: "head_m"
  - type: BodyPart
    partType: Head
    vital: true
  - type: Input
    context: "ghost"
  - type: InputMover
  - type: GhostOnMove
  - type: Tag
    tags:
      - Head

