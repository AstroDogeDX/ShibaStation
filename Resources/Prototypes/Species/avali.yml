- type: species
  id: Avali
  name: species-name-avali
  roundStart: false
  prototype: MobAvali
  sprites: MobAvaliSprites
  defaultSkinTone: "#ffff0f"
  markingLimits: MobAvaliMarkingLimits
  dollPrototype: MobAvaliDummy
  skinColoration: Hues

- type: speciesBaseSprites
  id: MobAvaliSprites
  sprites:
    Head: MobAvaliHead
    Snout: MobHumanoidAnyMarking
    Chest: MobAvaliTorso
    HeadTop: MobHumanoidAnyMarking
    HeadSide: MobHumanoidAnyMarking
    Tail: MobHumanoidAnyMarking
    Eyes: MobAvaliEyes
    LArm: MobAvaliLArm
    RArm: MobAvaliRArm
    LHand: MobAvaliLHand
    RHand: MobAvaliRHand
    LLeg: MobAvaliLLeg
    RLeg: MobAvaliRLeg
    LFoot: MobAvaliLFoot
    RFoot: MobAvaliRFoot

- type: markingPoints
  id: MobAvaliMarkingLimits
  onlyWhitelisted: true
  points:
    Hair:
      points: 0
      required: false
    Tail:
      points: 1
      required: true
      defaultMarkings: [ AvaliTailDefault ]
    HeadTop:
      points: 1
      required: true
      defaultMarkings: [ AvaliEarsDefault ]
    Head:
      points: 1
      required: false
    Arms:
      points: 1
      required: true
      defaultMarkings: [ AvaliWingsDefault ]

