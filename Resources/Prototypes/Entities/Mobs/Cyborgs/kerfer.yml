# omg kerfur hi

- type: entity
  id: BorgChassisKerfer
  parent: BaseBorgChassisNT
  name: kerfer
  description: A cat-shaped-robot-buddy designed to help haul cargo around the station. No brain required. Meow!
  components:
  - type: GhostRole
    makeSentient: true
    allowSpeech: true
    allowMovement: true
    name: ghost-role-information-kerfer-name
    description: ghost-role-information-kerfer-description
    rules: ghost-role-information-silicon-rules
  - type: GhostTakeoverAvailable
  - type: Sprite
    layers:
    - state: kerfer
    - state: kerfer_e
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
  - type: BorgChassis
    maxModules: 4
    moduleWhitelist:
      tags:
      - BorgModuleGeneric
      - BorgModuleService
    hasMindState: kerfer_e
    noMindState: kerfer_e_sad
  - type: BorgTransponder
    sprite:
      sprite: Mobs/Silicon/chassis.rsi
      state: kerfer
    name: kerfer
  - type: Construction
    node: service
  - type: IntrinsicRadioTransmitter
    channels:
    - Supply
    - Binary
    - Common
    - Science
  - type: ActiveRadio
    channels:
    - Supply
    - Binary
    - Common
    - Science
  - type: AccessReader
    access: [["Cargo"], ["Command"], ["Research"]]
  - type: BorgChassis
    maxModules: 3
    moduleWhitelist:
      tags:
      - BorgModuleGeneric # Might remove this, kerfers should probably be pretty helpless and rely on crew, as they're not 'true borgs'.
      - BorgModuleSyndicate # But can still be given syndie upgrades for the funny emag evil kerfer moments.
      - BorgModuleSyndicateAssault
  - type: ContainerContainer
    containers: # No brain slot, kerfers share a single braincell
      cell_slot: !type:ContainerSlot { }
      borg_module: !type:Container { }
      part-container: !type:Container
  - type: Inventory
    templateId: borgTall
  - type: InteractionPopup
    interactSuccessString: petting-success-kerfer-cyborg
    interactFailureString: petting-failure-kerfer-cyborg
    interactSuccessSound:
      path: /Audio/Ambience/Objects/kerfer_meow.ogg
  - type: MovementSpeedModifier
    baseWalkSpeed : 2.5
    baseSprintSpeed : 5.5
  - type: FelinidAccent
  - type: Storage
    grid:
    - 0,0,4,6
  - type: Tag
    tags:
    - DoorBumpOpener
    - FootstepSound
    - CanPilot
    - Kerfer
  - type: LockingWhitelist
    whitelist:
      tags:
      - Kerfer # This is a bit of a hack, but it means only Kerfers can unlock themselves and other Kerfers.
    blacklist:
      components:
      - RoboticsConsole
      tags:
      - Cyborg
