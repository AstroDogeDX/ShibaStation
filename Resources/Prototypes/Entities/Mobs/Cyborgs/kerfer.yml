# omg kerfur hi

- type: entity
  id: BorgChassisKerfer
  parent: BaseBorgChassisNT
  name: kerfer
  components:
  - type: Sprite
    layers:
    - state: kerfer
    - state: kerfer_e
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
  - type: BorgChassis
    maxModules: 4
    moduleWhitelist:
      tags:
      - BorgModuleGeneric
      - BorgModuleService
    hasMindState: kerfer_e
    noMindState: kerfer_e_sad
  - type: BorgTransponder
    sprite:
      sprite: Mobs/Silicon/chassis.rsi
      state: kerfer
    name: kerfer
  - type: IntrinsicRadioTransmitter
    channels:
    - Cargo
    - Binary
    - Common
    - Science
  - type: ActiveRadio
    channels:
    - Cargo
    - Binary
    - Common
    - Science
  - type: AccessReader
    access: [["Command"], ["Research"], ["Cargo"]] # Kerfer can unlock themselves to allow access to their inventories, and should do so as per laws. Cargo gets direct access as Kerfer is a Cargo Borg.
  - type: Inventory
    templateId: borgTall
  - type: InteractionPopup
    interactSuccessString: petting-success-kerfer-cyborg
    interactFailureString: petting-failure-kerfer-cyborg
    interactSuccessSound:
      path: /Audio/Ambience/Objects/kerfer_meow.ogg
  - type: MovementSpeedModifier
    baseWalkSpeed : 2.5
    baseSprintSpeed : 5.5
  - type: FelinidAccent # meow!
  - type: Storage # Kerfers have an inventory as they are primarily cargo borgs.
    grid:
    - 0,0,7,5
  - type: Tag
    tags:
    - DoorBumpOpener
    - FootstepSound
    - CanPilot
    - Kerfer
  - type: LockingWhitelist
    whitelist:
      tags:
      - Kerfer # This is a bit of a hack, but it means only Kerfers can unlock themselves and other Kerfers.
    blacklist:
      components:
      - RoboticsConsole
      tags:
      - Cyborg
